                linear-gradient(160deg, var(--bg-1), var(--bg-3) 55%, var(--bg-2));
            transition: background 0.25s;
        }

        .aurora::before {
            content: "";
            position: absolute;
            inset: -10%;
            background-image: radial-gradient(1.4px 1.4px at 20% 30%, rgba(255, 255, 255, 0.65), transparent),
                radial-gradient(1.4px 1.4px at 65% 65%, rgba(255, 255, 255, 0.45), transparent),

            background-repeat: repeat;
            background-size: 380px 380px;
            opacity: 0.55;
            mix-blend-mode: overlay;
        }

        .onda-tema {
            inset: 0;

            }

                border-color 0.25s,
                box-shadow 0.25s;
        }

        .tooltip-texto {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translate(-50%, 4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;

            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 0.15s,
                transform 0.15s,
                visibility 0.15s;
            z-index: 10;
        }

        .tooltip-texto::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);

            border-top-color: var(--btn-border);
